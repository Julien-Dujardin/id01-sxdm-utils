[project]
name = "id01-sxdm"
version = "0.2.0"
description = "Visual analysis of scanning X-ray diffraction microscopy data"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Edoardo Zatterin", email = "ezatterin@yahoo.it" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.1.3",
    "scipy>=1.14",
    "h5py>=3.12",
    "hdf5plugin>=5",
    "tqdm>=4.67",
]

[project.optional-dependencies]
visual = ["plotly>=6.0"]
marimo = ["marimo>=0.19", "plotly>=6.0"]
analysis = [
    "matplotlib>=3.9.3",
    "pandas>=2.2.3",
    "scikit-image>=0.24",
    "silx>=2.2",
    "xrayutilities>=1.7.9",
    "gif>=23.3.0",
]
jupyter = ["ipywidgets>=8.1.5", "ipympl>=0.9.7", "ipykernel>=6.29.5"]

[project.urls]
repository = "https://github.com/Julien-Dujardin/id01-sxdm-utils"
upstream = "https://gitlab.esrf.fr/id01-science/id01-sxdm-utils"
documentation = "https://id01-science.gitlab-pages.esrf.fr/id01-sxdm-utils/"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14", "build>=1.2"]
docs = [
    "sphinx>=8.1", "myst-parser>=4", "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2", "sphinx-design>=0.6.1",
    "myst-nb>=1.1", "sphinx-autodoc2>=0.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sxdm"]

[tool.hatch.build.targets.sdist]
only-include = ["sxdm/", "tests/", "examples/", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external ESRF data and legacy dependencies"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E501"]
exclude = ["*.ipynb"]

[tool.ruff.format]
exclude = ["*.ipynb"]
