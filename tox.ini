# Optional tox runner; uv is the primary development workflow.
[tox]
env_list = py{311,312,313,314}
requires = tox>=4
skip_missing_interpreters = True

[testenv]
package = wheel
extras = marimo, analysis, jupyter
deps = pytest>=8.3
set_env =
    MPLBACKEND = Agg
    OPENBLAS_NUM_THREADS = 1
commands = pytest {posargs:tests}
