#########################
# Environment Variables #
#########################

variables:
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit

#######################
# Caching Strategy   #
#######################

cache:
  key: ${CI_COMMIT_REF_SLUG}  # Cache per branch
  paths:
    - .cache/pip
    - .cache/pre-commit
    - .venv
    - doc/build/.doctrees  # Cache Sphinx doctrees
  policy: pull-push  # More efficient cache policy

##################
# Job templates  #
##################

# uv installation script
.uv-install: &uv-install
  image: python:3.14-bookworm
  before_script:
    - pip install uv==0.13.5
    - uv sync --locked --extra marimo --extra analysis --extra jupyter --group docs

# Pandoc installation script
.pandoc-install: &pandoc-install |
  export PANDOC_VER=2.19.2
  wget -q https://github.com/jgm/pandoc/releases/download/$PANDOC_VER/pandoc-$PANDOC_VER-linux-amd64.tar.gz
  tar xzf pandoc-$PANDOC_VER-linux-amd64.tar.gz
  mv pandoc-$PANDOC_VER/bin/pandoc /usr/local/bin/

# Only build and deploy docs when
.doc-rules: &doc-rules
  rules:
    # The commit is to the main branch AND contains "build_docs" in the message, OR
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /build_docs/
    # The commit is to the main branch AND changes documentation files
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "doc/**/*"
        - "**/*.md"
        - "**/*.rst"

#########################
# Pipeline Definition   #
#########################

stages:
  - verify    # Code quality and formatting checks
  - build     # Build documentation and assets
  - test      # Run test suites
  - deploy    # Deploy documentation and packages

############
# Verify   #
############

lint:
  <<: *uv-install
  stage: verify
  script:
    - uv run --no-sync ruff check sxdm tests examples
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#########
# Build #
#########

# Build docs
doc:
  <<: [*uv-install, *doc-rules]
  stage: build
  script:
    - *pandoc-install
    - uv run --no-sync sphinx-build -D nb_execution_mode=off -b html doc/source doc/build/html
  artifacts:
    paths:
      - doc/build/
    when: on_success
    expire_in: 2h

#########
# Test  #
#########

test:
  <<: *uv-install
  stage: test
  script:
    - uv run --no-sync pytest tests/ --junitxml=tests/report.xml
  artifacts:
    when: always
    reports:
      junit: tests/report*.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /run_tests/

###########
# Deploy  #
###########

# Deploy docs
pages:
  stage: deploy
  image: debian:latest
  before_script: []
  script:
    - mv doc/build/html public
  artifacts:
    paths:
      - public
  <<: *doc-rules
  needs:
    - doc

# Package builds are verified locally and by the GitHub Actions Python matrix.
